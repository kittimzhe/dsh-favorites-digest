[project]
name = "favorites-digest"
version = "0.1.0"
description = "Export and summarize your Douyin and Xiaohongshu collections using a logged-in browser session."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "playwright>=1.48.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
favorites-digest = "favorites_digest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
